name: Source capture and durable sinks with consumer effects through M4.1
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Provision exact npm
        run: |
          npm install --prefix .tools/npm --no-audit --no-fund --ignore-scripts npm@12.0.2
          echo "$GITHUB_WORKSPACE/.tools/npm/node_modules/.bin" >> "$GITHUB_PATH"
      - run: node scripts/ci-step.ts npm ci --no-audit --no-fund
      - run: node scripts/ci-step.ts npm run tools:provision
      - name: Provision ephemeral GitHub VM Elasticsearch prerequisite
        if: ${{ runner.environment == 'github-hosted' && runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          source /etc/os-release
          [[ "$ID" == "ubuntu" && "$VERSION_ID" == "24.04" ]]
          mkdir -p artifacts/ci/public
          before=$(sysctl -n vm.max_map_count)
          [[ "$before" =~ ^[0-9]+$ ]]
          node -e 'const fs=require("node:fs"); const before=process.argv[1]; fs.writeFileSync("artifacts/ci/public/es-host-provisioning.json",JSON.stringify({phase:"github-hosted-ubuntu-24.04-provisioning",platform:process.platform,required:"1048576",observedBefore:before,status:"STARTED"},null,2)+"\n"); console.log("vm.max_map_count before="+before+" required=1048576");' "$before"
          if (( before < 1048576 )); then
            sudo sysctl -w vm.max_map_count=1048576
          fi
          after=$(sysctl -n vm.max_map_count)
          [[ "$after" =~ ^[0-9]+$ ]]
          node -e 'const fs=require("node:fs"); const [before,after]=process.argv.slice(1); const ok=BigInt(after)>=1048576n && (BigInt(before)<1048576n || after===before); const record={phase:"github-hosted-ubuntu-24.04-provisioning",platform:process.platform,required:"1048576",observedBefore:before,observedAfter:after,status:ok?"PASS":"FAIL",persistentTuning:false}; fs.writeFileSync("artifacts/ci/public/es-host-provisioning.json",JSON.stringify(record,null,2)+"\n"); console.log(JSON.stringify(record)); if(!ok)process.exitCode=1;' "$before" "$after"
      - name: Quality, prior profiles and real broker and consumer acceptance
        run: node scripts/ci-step.ts make verify-m4-1
      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/m1/**/public/**
            artifacts/m2a/**/public/**
            artifacts/m2b/**/public/**
            artifacts/m2c/**/public/**
            artifacts/m2c1/**/public/**
            artifacts/m4/**/public/**
            artifacts/m41/**/public/**
            artifacts/m41-repro/**/public/**
            artifacts/m3/**/public/**
            artifacts/m3-oracle/**/public/**
            artifacts/m3.1/**/public/**
            artifacts/ci/public/**
          if-no-files-found: error
          retention-days: 7
