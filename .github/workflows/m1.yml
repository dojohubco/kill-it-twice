name: Fast functional checks and optional full acceptance
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_acceptance:
        description: Run million-entity acceptance on the explicitly provisioned capacity runner
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Provision exact npm
        run: |
          npm install --prefix .tools/npm --no-audit --no-fund --ignore-scripts npm@12.0.2
          echo "$GITHUB_WORKSPACE/.tools/npm/node_modules/.bin" >> "$GITHUB_PATH"
      - run: node scripts/ci-step.ts npm ci --no-audit --no-fund
      - run: node scripts/ci-step.ts npm run tools:provision
      - name: Verify provisioned browser with sandbox enabled
        run: |
          timeout 45s node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { realpath } from 'node:fs/promises';
          import { chromium } from 'playwright-core';
          import { uiBrowserExecutable } from './tests/support/ui-browser.ts';
          const executablePath = await uiBrowserExecutable();
          console.log(JSON.stringify({ executablePath, realPath: await realpath(executablePath), chromiumSandbox: true }));
          const browser = await chromium.launch({ executablePath, headless: true, chromiumSandbox: true });
          try {
            const page = await browser.newPage();
            await page.setContent('<h1>CI browser preflight</h1>');
            assert.equal(await page.getByRole('heading').innerText(), 'CI browser preflight');
            console.log(JSON.stringify({ status: 'PASS', browser: browser.version() }));
          } finally {
            await browser.close();
          }
          NODE
      - name: Provision ephemeral GitHub VM Elasticsearch prerequisite
        if: ${{ runner.environment == 'github-hosted' && runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          source /etc/os-release
          [[ "$ID" == "ubuntu" && "$VERSION_ID" == "24.04" ]]
          mkdir -p artifacts/ci/public
          before=$(sysctl -n vm.max_map_count)
          [[ "$before" =~ ^[0-9]+$ ]]
          node -e 'const fs=require("node:fs"); const before=process.argv[1]; fs.writeFileSync("artifacts/ci/public/es-host-provisioning.json",JSON.stringify({phase:"github-hosted-ubuntu-24.04-provisioning",platform:process.platform,required:"1048576",observedBefore:before,status:"STARTED"},null,2)+"\n"); console.log("vm.max_map_count before="+before+" required=1048576");' "$before"
          if (( before < 1048576 )); then
            sudo sysctl -w vm.max_map_count=1048576
          fi
          after=$(sysctl -n vm.max_map_count)
          [[ "$after" =~ ^[0-9]+$ ]]
          node -e 'const fs=require("node:fs"); const [before,after]=process.argv.slice(1); const ok=BigInt(after)>=1048576n && (BigInt(before)<1048576n || after===before); const record={phase:"github-hosted-ubuntu-24.04-provisioning",platform:process.platform,required:"1048576",observedBefore:before,observedAfter:after,status:ok?"PASS":"FAIL",persistentTuning:false}; fs.writeFileSync("artifacts/ci/public/es-host-provisioning.json",JSON.stringify(record,null,2)+"\n"); console.log(JSON.stringify(record)); if(!ok)process.exitCode=1;' "$before" "$after"
      - name: Quality and small real fault fixture (not full-scale acceptance)
        run: node scripts/ci-step.ts make verify-functional
      - name: Build and verify the rendered operator interface
        run: node scripts/ci-step.ts make verify-ui
      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/m1/**/public/**
            artifacts/m2a/**/public/**
            artifacts/m2b/**/public/**
            artifacts/m2c/**/public/**
            artifacts/m2c1/**/public/**
            artifacts/m5a/**/public/**
            artifacts/m5b/**/public/**
            artifacts/m6/**/public/**
            artifacts/m5b-empty/**/public/**
            artifacts/m4/**/public/**
            artifacts/m41/**/public/**
            artifacts/m41-repro/**/public/**
            artifacts/m3/**/public/**
            artifacts/m3-oracle/**/public/**
            artifacts/m3.1/**/public/**
            artifacts/ci/public/**
            artifacts/final/*/public/**
            artifacts/ui/browser-*/**
          if-no-files-found: error
          retention-days: 7

  full:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_acceptance }}
    runs-on: [self-hosted, linux, x64, kill-it-twice-acceptance]
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check pre-provisioned versions and prerequisites
        run: |
          test "$(node --version)" = v24.19.0
          test "$(npm --version)" = 12.0.2
          node scripts/runtime-preflight.ts
      - run: npm ci --no-audit --no-fund
      - run: npm run tools:provision
      - name: Full one-million-entity final acceptance
        run: node scripts/ci-step.ts make verify
      # Raw installation artifacts are local; publish only after explicit sanitization/review.
