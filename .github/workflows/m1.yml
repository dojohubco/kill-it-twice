name: Source and local staging gates through M2B
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Provision exact npm
        run: |
          npm install --prefix .tools/npm --no-audit --no-fund --ignore-scripts npm@12.0.2
          echo "$GITHUB_WORKSPACE/.tools/npm/node_modules/.bin" >> "$GITHUB_PATH"
      - run: node scripts/ci-step.ts npm ci --no-audit --no-fund
      - run: node scripts/ci-step.ts npm run tools:provision
      - name: Quality and fresh PostgreSQL acceptance
        run: node scripts/ci-step.ts make verify-m2b
      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/m1/**/public/**
            artifacts/m2a/**/public/**
            artifacts/m2b/**/public/**
            artifacts/ci/public/**
          if-no-files-found: error
          retention-days: 7
