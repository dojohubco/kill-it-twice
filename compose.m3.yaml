services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.4@sha256:82ac14f43fe701992e601f4cc81e1c0d7dbc5a2576d8cd736006452925df4026
    environment:
      discovery.type: single-node
      cluster.name: kill-it-twice-m3
      xpack.security.enabled: 'true'
      xpack.security.autoconfiguration.enabled: 'false'
      xpack.security.http.ssl.enabled: 'true'
      xpack.security.http.ssl.key: /usr/share/elasticsearch/config/private/server.key
      xpack.security.http.ssl.certificate: /usr/share/elasticsearch/config/private/server.crt
      ELASTIC_PASSWORD_FILE: /usr/share/elasticsearch/config/private/password
      ES_JAVA_OPTS: -Xms1g -Xmx1g
      action.auto_create_index: 'false'
      ingest.geoip.downloader.enabled: 'false'
    mem_limit: 2g
    ports: ['127.0.0.1:${M3_ES_PORT:-0}:9200']
    volumes:
      - es-data:/usr/share/elasticsearch/data
      - ${M3_PRIVATE_DIR:?Use the isolated M3 runner}:/usr/share/elasticsearch/config/private:ro,Z
    stop_grace_period: 20s
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0@sha256:9378ed52a28bc50edc1350f936f518f31fa95f0d15917d6eb40b8e376d1a214e
    ports: ['127.0.0.1::8474', '127.0.0.1::8666']
    mem_limit: 128m
volumes:
  es-data:
