services:
  pipeline:
    image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
    environment:
      POSTGRES_USER: pipeline_admin
      POSTGRES_DB: pipeline_m2b
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports: ['127.0.0.1::5432']
    volumes:
      - pipeline-data:/var/lib/postgresql
      - ${M2B_PASSWORD_FILE:?Use npm run test:integration:m2b}:/run/secrets/postgres_password:ro,Z
    command: ['postgres', '-c', 'log_min_error_statement=panic']
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -h 127.0.0.1 -U pipeline_admin -d pipeline_m2b',
        ]
      interval: 1s
      timeout: 3s
      retries: 45
    stop_grace_period: 10s
volumes:
  pipeline-data:
