services:
  source:
    image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
    environment:
      POSTGRES_USER: m1_admin
      POSTGRES_DB: source_m1
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports: ["127.0.0.1::5432"]
    volumes:
      - source-data:/var/lib/postgresql
      # Relabel only this run's private temporary file on SELinux hosts.
      - ${M1_PASSWORD_FILE:?Use npm run test:integration:m1}:/run/secrets/postgres_password:ro,Z
    # Suppress SQL text in error logs (role setup can contain temporary passwords).
    # fsync, synchronous_commit and full_page_writes retain their durable defaults.
    command: ["postgres", "-c", "log_min_error_statement=panic"]
    healthcheck:
      # The image's temporary initialization server listens only on a Unix socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U m1_admin -d source_m1"]
      interval: 1s
      timeout: 3s
      retries: 45
    stop_grace_period: 10s
volumes:
  source-data:
